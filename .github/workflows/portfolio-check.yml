name: Portfolio smoke checks
on:
  pull_request:
  push:
    branches: [main, portfolio/selected-work-solvo-2026]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/selected-work.js
      - run: node scripts/check-portfolio.mjs
